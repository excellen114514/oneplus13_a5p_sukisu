name: OnePlus_Pad2_Pro

on:
  workflow_dispatch:
    inputs:
      ksu_setup_branch:
        description: "🌿 ReSukiSU setup.sh 分支"
        required: true
        default: main
        type: choice
        options:
          - main
          - dev
      ksu_meta:
        description: "📦 ReSukiSU 源码: 分支/自定义Tag/可选Commit"
        required: false
        default: "main/⚡Ultra⚡/"
      susfs_meta:
        description: "🔒 SUSFS 版本: 留空=最新 | 提交哈希或 HEAD~N=回滚 | -1=禁用"
        required: false
        default: ""
      enable_sched_ext:
        description: "⚙️ 合入 sched_ext"
        required: true
        default: true
        type: boolean
      container_mode:
        description: "🐳 容器/Docker: 4=安全模式(推荐,不碰task_struct) | 0=关闭 | 1/2/3=开SYSVIPC+kABI槽位组合(卡第一屏就换下一个)"
        required: true
        default: "4"
        type: choice
        options:
          - "4"
          - "0"
          - "1"
          - "2"
          - "3"
      container_ipc_ns:
        description: "🧱 开启 IPC namespace（Docker 必需；走 POSIX_MQUEUE，不碰 task_struct，无卡开机风险）"
        required: true
        default: true
        type: boolean
      cgroup_device_controller:
        description: "🧩 cgroup v1 devices 控制器 — ⚠️ 一加机型卡开机元凶，默认关闭；仅 Docker 设备白名单需要"
        required: true
        default: false
        type: boolean
      risky_container_extras:
        description: "⚠️ 其余高风险项（kABI 补丁/SYSVIPC/PID_NS/FHANDLE/diag）— 仅在 minimal 已能开机时才开"
        required: true
        default: false
        type: boolean
        # ⚠️ 与 container_mode 的联动：本开关为 false 时，即使把 container_mode 设成
        #    1/2/3，kABI 补丁与 CONFIG_SYSVIPC 也都不会执行（见两处 if 条件）。
        #    想验证 SysV IPC / kABI 槽位时，必须同时把本项改成 true，否则会
        #    "改了 container_mode 但行为没变"，白白浪费一次构建。
      container_level:
        description: "🧪 容器配置档位: minimal=仅公认安全项(先验证能否开机) | standard=+可选安全项 | full=全部"
        required: true
        default: "minimal"
        type: choice
        options:
          - minimal
          - standard
          - full
      create_release:
        description: "📤 发布 GitHub Release"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: write

concurrency:
  group: resukisu-pad2pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 8G
      # 避免 git 在 CI 里卡在凭据提示上（无应答器环境会以 128 直接失败）
      GIT_TERMINAL_PROMPT: "0"
      # 自由格式输入统一转成环境变量，避免直接拼接进脚本产生注入风险
      KSU_SETUP_BRANCH: ${{ inputs.ksu_setup_branch || 'main' }}
      KSU_META: ${{ inputs.ksu_meta || 'main/⚡Ultra⚡/' }}
      SUSFS_META: ${{ inputs.susfs_meta }}
      # 容器/Docker 支持。container_mode:
      #   4 = 安全模式（推荐）：完全不碰 struct task_struct —— 不开 SYSVIPC、
      #       不打 kABI 补丁，改用 POSIX_MQUEUE 满足 IPC_NS 的依赖。
      #       ⇒ 排除掉"卡第一屏"的头号原因，同时仍然拿到 Docker 必需的 IPC namespace。
      #   0 = 完全不加容器配置（基线对照用）
      #   1/2/3 = 开启 SYSVIPC 并用对应的 kABI padding 槽位组合承接 sysvsem/sysvshm。
      #       厂商预编译模块占用的槽位随系统版本变化，卡第一屏就换下一个（2 → 3）。
      #       1 = 槽位 1 + (2;3)，2 = 槽位 6 + (7;8)，3 = 槽位 3 + (4;5)
      CONTAINER_MODE: ${{ inputs.container_mode || '4' }}
      CONTAINER_LEVEL: ${{ inputs.container_level || 'minimal' }}
      CONTAINER_IPC_NS: ${{ inputs.container_ipc_ns == false && 'false' || 'true' }}
      CGROUP_DEVICE_CONTROLLER: ${{ inputs.cgroup_device_controller == false && 'false' || 'true' }}
      RISKY_CONTAINER_EXTRAS: ${{ inputs.risky_container_extras == false && 'false' || 'true' }}
      DEVICE_ID: "pad2pro"
      DEVICE_NAME: "OnePlus Pad 2 Pro"
      DEVICE_NAME_SAFE: "OnePlusPad2Pro"
      DEVICE_CODENAME: "sun"
      CPU: "sm8750"
      KANDROID_VERSION: "android15"
      KERNEL_VERSION: "6.6"
      KERNEL_SUFFIX: "-Elaina-ExceSama"

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "excellen114514"
          git config --global user.email "xiuxianing@foxmail.com"
          git config --global advice.detachedHead false

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 git curl jq ccache zip libelf-dev build-essential flex bison libssl-dev \
            libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix \
            kmod libdw-dev elfutils bc cpio wget
          sudo apt-get clean

      - name: Install repo tool
        run: |
          curl -fL --proto '=https' --tlsv1.2 \
            https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/repo"
          chmod a+x "$HOME/repo"
          sudo mv "$HOME/repo" /usr/local/bin/repo
          repo version | head -1 || true

      - name: Initialize repo and sync (OnePlus OSS sm8750)
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b refs/heads/oneplus/sm8750 -m oneplus_pad_2_pro.xml --depth=1
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle --force-sync

          rm -f kernel_platform/common/android/abi_gki_protected_exports_* 2>/dev/null || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* 2>/dev/null || true

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-pad2pro-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-pad2pro-
            ccache-${{ runner.os }}-

      - name: Kernel version handling
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform

          TKERNEL_VERSION="$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)"
          echo "TKERNEL_VERSION=${TKERNEL_VERSION}" >> "$GITHUB_ENV"
          echo "DATE=$(date +%F)" >> "$GITHUB_ENV"
          echo "✅ 内核版本 ${TKERNEL_VERSION}"

      - name: Install ReSukiSU
        run: |
          set -euo pipefail

          cd kernel_workspace/kernel_platform

          IFS='/' read -r KSU_BRANCH KSU_CUSTOM_TAG MANUAL_HASH <<< "${KSU_META}"
          KSU_BRANCH="${KSU_BRANCH:-main}"

          curl -fL --proto '=https' --tlsv1.2 -o /tmp/ksu_setup.sh \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/${KSU_SETUP_BRANCH}/kernel/setup.sh"

          # setup.sh 以当前目录为 GKI_ROOT：克隆 KernelSU、创建 common/drivers/kernelsu
          # 软链，并把 kernelsu 写进 drivers/Makefile 与 drivers/Kconfig
          bash /tmp/ksu_setup.sh "${KSU_BRANCH:-main}"

          [ -e ./common/drivers/kernelsu ] || { echo "❌ drivers/kernelsu 软链创建失败"; exit 1; }
          grep -q "kernelsu" ./common/drivers/Makefile || { echo "❌ drivers/Makefile 未接入 KernelSU"; exit 1; }
          grep -q "drivers/kernelsu/Kconfig" ./common/drivers/Kconfig || { echo "❌ drivers/Kconfig 未接入 KernelSU"; exit 1; }

          cd ./KernelSU

          if [ -n "${MANUAL_HASH:-}" ]; then
            git fetch origin "$KSU_BRANCH" --depth=100
            git checkout "$MANUAL_HASH"
          fi

          KSU_COMMIT_SHA="$(git rev-parse HEAD)"
          KSU_VERSION=$(( $(git rev-list --count HEAD 2>/dev/null || echo 13000) + 30700 ))

          {
            echo "KSU_CUSTOM_TAG=${KSU_CUSTOM_TAG}"
            echo "KSU_COMMIT_SHA=${KSU_COMMIT_SHA}"
            echo "KSUVER=${KSU_VERSION}"
          } >> "$GITHUB_ENV"

          echo "✅ ReSukiSU ${KSU_BRANCH} @ ${KSU_COMMIT_SHA} -> ${KSU_VERSION}"

      - name: Container support — kABI-safe SYSVIPC patch
        # 只有真的要开 CONFIG_SYSVIPC 时才改 sched.h，即 CONTAINER_MODE 为 1/2/3。
        # CONTAINER_MODE=4（安全模式）与 0 都完全不碰 task_struct，
        # 把"改了核心结构体"这个变量从排查中彻底移除。
        if: ${{ env.CONTAINER_MODE != '0' && env.CONTAINER_MODE != '4' && env.RISKY_CONTAINER_EXTRAS == 'true' }}
        run: |
          set -euo pipefail

          COMMON=kernel_workspace/kernel_platform/common
          SCHED="$COMMON/include/linux/sched.h"
          [ -f "$SCHED" ] || { echo "❌ 找不到 $SCHED"; exit 1; }

          # 为什么必须打这个补丁（仅在 RISKY_CONTAINER_EXTRAS=true、即真的要开 SYSVIPC 时）：
          #   Docker/LXC 要求 CONFIG_IPC_NS=y，而 IPC_NS 依赖 SYSVIPC 或 POSIX_MQUEUE。
          #   直接开 CONFIG_SYSVIPC 会让 task_struct 新增 sysvsem/sysvshm 两个成员，
          #   把其后所有字段的偏移量顶掉 → 与厂商预编译模块(kgsl/相机/显示等)的 kABI
          #   不再匹配 → 模块加载失败 / 内核崩溃 → 卡开机。
          #   本补丁把这两个成员搬进 struct task_struct 末尾 Android 预留的 kABI
          #   padding 槽位，字段偏移量保持不变。
          #   思路与 Droidspaces 项目 (ravindu644/Droidspaces-OSS) 的 GKI kABI 修补一致，
          #   这里内联实现，不依赖外部补丁文件能否按上下文应用成功。
          #   ⚠️ 这仍是一次性地改动核心结构体，属于"卡第一屏"的可疑对象，
          #      因此默认不执行；要开时请把它当成独立的一次二分实验。
          case "${CONTAINER_MODE}" in
            1) KABI_SLOTS=(1 2 3) ;;
            2) KABI_SLOTS=(6 7 8) ;;
            3) KABI_SLOTS=(3 4 5) ;;
            4) echo "❌ CONTAINER_MODE=4 是安全模式：不应执行 kABI 补丁（请检查步骤 if 条件）"; exit 1 ;;
            *) echo "❌ 未知 CONTAINER_MODE=${CONTAINER_MODE}（应为 0/1/2/3/4）"; exit 1 ;;
          esac

          python3 - "$SCHED" "${KABI_SLOTS[0]}" "${KABI_SLOTS[1]}" "${KABI_SLOTS[2]}" <<'PY'
          import re
          import sys

          path, s1, s2, s3 = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          raw = open(path, encoding="utf-8", newline="").read()

          # 统一成 LF 再改写：kernel 源码理论上是 LF，但本地/CI 缓存都可能带上 CRLF，
          # 而写死 "\n" 的正则遇到 CRLF 会整体静默失配（这次就是栽在这里）。
          had_crlf = "\r\n" in raw
          text = raw.replace("\r\n", "\n").replace("\r", "\n")

          # 幂等：若该树已经处理过（成员已在 kABI 槽位里）就直接跳过
          if "ANDROID_KABI_USE" in text and re.search(r"ANDROID_KABI_USE\(\s*\d+\s*,\s*struct sysv_sem sysvsem\s*\)", text):
              print("ALREADY")
              raise SystemExit(0)

          # 1. 去掉 task_struct 中部原本的 SYSVIPC 成员（它们才是偏移量破坏者）
          #    采用「逐行判定」而不是跨行正则：sysvsem/sysvshm 之间夹注释、缩进或
          #    对齐方式变化都不会失配（跨行正则已连续踩坑，这里彻底换掉）。
          #    本步骤逻辑与 githubworkflow/test_container_kabi_patch.py 保持一致，
          #    后者可离线运行验证是否仍能命中。
          member_re = re.compile(r"^\s*struct\s+sysv_(?:sem|shm)\s+sysv(?:sem|shm)\s*;")
          ifdef_re = re.compile(r"^\s*#\s*ifdef\s+CONFIG_SYSVIPC\b")
          endif_re = re.compile(r"^\s*#\s*endif\b")

          lines = text.split("\n")
          hits = [i for i, ln in enumerate(lines) if member_re.match(ln)]
          if len(hits) != 2:
              print(f"ERROR:匹配到 {len(hits)} 条 sysv 成员声明，期望 2 条")
              for i, ln in enumerate(lines):
                  if "sysv_" in ln:
                      print(f"  {i + 1:5d}| {ln!r}")
              raise SystemExit(1)
          first, second = hits

          replacement = (
              "/*\n"
              "\t * CONFIG_SYSVIPC 的两个成员已改放到本结构末尾的 Android kABI\n"
              "\t * padding 槽位（见下方 ANDROID_KABI_USE），以免改变后续字段偏移量。\n"
              "\t */"
          )

          open_idx = None
          for i in range(first - 1, max(first - 6, -1), -1):
              if ifdef_re.match(lines[i]):
                  open_idx = i
                  break

          close_idx = None
          if open_idx is not None:
              for j in range(second + 1, len(lines)):
                  if endif_re.match(lines[j]):
                      close_idx = j
                      break

          if open_idx is not None and close_idx is not None and close_idx > second:
              print(f"DEBUG:与 #ifdef 整块一起替换（{close_idx - open_idx + 1} 行）")
              lines = lines[:open_idx] + [replacement] + lines[close_idx + 1:]
          else:
              print("DEBUG:未包裹在 #ifdef 中，仅移除两行成员声明")
              keep, inserted = [], False
              for i, ln in enumerate(lines):
                  if i in (first, second):
                      if not inserted:
                          keep.append(replacement)
                          inserted = True
                      continue
                  keep.append(ln)
              lines = keep

          text = "\n".join(lines)

          # 2. 校验槽位都在 struct task_struct 内
          #    注意 end 必须换算成绝对下标：切片查找返回的是相对 m.end() 的偏移，
          #    直接和绝对下标比较会让所有槽位都被误判为「不在范围内」。
          sm = re.search(r"(?m)^struct task_struct \{[^\n]*\n", text)
          if not sm:
              print("ERROR:未在 sched.h 中定位到 struct task_struct 定义")
              raise SystemExit(1)
          tail = re.search(r"\n\};", text[sm.end():])
          if not tail:
              print("ERROR:未定位到 struct task_struct 定义结尾")
              raise SystemExit(1)
          start, end = sm.end(), sm.end() + tail.start()

          # 关键：槽位号 1-4 在 sched_entity / sched_rt_entity / task_struct 里都出现，
          # 而 sched_entity 排在 task_struct 之前。
          # 因此绝不能「校验时限定范围、替换时却 subn(count=1)」——那会打中 sched_entity，
          # 把槽位号替换成那边的缩进。这里直接按位置在 task_struct 区域内替换。
          slot_pat = re.compile(r"(?m)^([ \t]*)ANDROID_KABI_RESERVE\((\d+)\);[ \t]*$")
          targets = []
          for s in (s1, s2, s3):
              found = [m for m in slot_pat.finditer(text)
                       if start <= m.start() < end and m.group(2) == s]
              if len(found) != 1:
                  print(f"ERROR:槽位 {s} 在 struct task_struct 内匹配到 {len(found)} 处，期望 1 处")
                  raise SystemExit(1)
              targets.append(found[0])

          # 3. 把原本“未使用”的保留槽位改写成承载 sysvsem / sysvshm
          #    用 % 拼接而非 f-string：f-string 表达式里不能出现反斜杠（\t 会语法错误）
          #
          #    ⚠️ 槽位数必须匹配结构体大小，这是本次 CI 报错的根因：
          #    include/linux/android_kabi.h 里
          #        #define _ANDROID_KABI_REPLACE(_orig, _new) \
          #            __ANDROID_KABI_CHECK_SIZE_ALIGN(_orig, _new); _new
          #        _Static_assert(sizeof(struct{_new;}) <= sizeof(struct{_orig;}), ...)
          #    _orig 是可变参数，多个槽位会用分号拼进同一个匿名 struct，尺寸相加。
          #    在 arm64 上 sizeof(u64) == 8：
          #        struct sysv_sem == 8  → 1 个槽位即可
          #        struct sysv_shm == 16 → 必须占 2 个连续槽位
          #    只给 1 个槽位就会得到
          #        "struct sysv_shm sysvshm is larger than u64 android_kabi_reserved2"
          #        且 expression evaluates to '16 <= 8'
          #    （验证：sizeof(struct{ANDROID_KABI_RESERVE(2);ANDROID_KABI_RESERVE(3);})
          #      == 16，正好容纳 sysvshm。）
          use_tpl = "ANDROID_KABI_USE(%s, struct sysv_sem sysvsem);"
          repl_tpl = ("_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(%s); "
                      "ANDROID_KABI_RESERVE(%s), struct sysv_shm sysvshm);")
          repl_frag = repl_tpl % (s2, s3)
          new_frag = {0: use_tpl % s1, 1: repl_frag, 2: ""}

          # 用「按行重建」而不是「按字符区间拼接」：
          #   槽位正则的 $ 锚点停在行尾换行符之前，所以 m.end() 指向 "\n" 前面。
          #   若用 text[:m.start()] + text[m.end():] 删行，被删行会退化成空字符串元素，
          #   经 .split("\n") / "\n".join() 往返后就被还原成一行真正的空行
          #   —— task_struct 里凭空多一个空行（变体 2 的槽位 8 恰好是最后一个
          #   ANDROID_KABI_RESERVE，后面紧跟空行，于是出现连续两个空行）。
          #   改成"新片段为空则整行丢弃"，问题从根上消失。
          as_lines = text.split("\n")
          drop_lines = set()
          for idx in range(3):
              _m = targets[idx]
              _li = text.count("\n", 0, _m.start())   # 该匹配所在的行号
              line = _m.group(1) + new_frag[idx]      # 保留原缩进
              if line.strip():
                  as_lines[_li] = line                # 原位替换
              else:
                  drop_lines.add(_li)                 # 只剩空白 → 整行删除
          if drop_lines:
              text = "\n".join(ln for i, ln in enumerate(as_lines) if i not in drop_lines)
          else:
              text = "\n".join(as_lines)

          # 成员声明必须已从中部彻底消失（逐行复查，不依赖具体缩进）
          if any(member_re.match(ln) for ln in text.split("\n")):
              print("ERROR:中部仍残留 sysv 成员声明")
              raise SystemExit(1)

          for frag in (use_tpl % s1, repl_frag):
              if text.count(frag) != 1:
                  print(f"ERROR:改写后 {frag!r} 出现 {text.count(frag)} 次，期望 1 次")
                  raise SystemExit(1)

          # 按原文件的换行风格写回：kernel 用 LF，但若检出带 CRLF 也不能给它混进 LF
          if had_crlf:
              text = text.replace("\n", "\r\n")
          with open(path, "w", encoding="utf-8", newline="") as fh:
              fh.write(text)
          print(f"PATCHED (eol={'CRLF' if had_crlf else 'LF'})")
          PY

          echo "🔎 sched.h diff:"
          git -C "$COMMON" diff --stat -- include/linux/sched.h || true
          git -C "$COMMON" diff -- include/linux/sched.h | sed -n '1,80p' || true

          # 到此 python 退出码为 0，说明补丁已成功应用或本就已处理过
          echo "✅ SYSVIPC 已置于 kABI padding 槽位 ${KABI_SLOTS[*]}（或该树已自带处理）"

      - name: Container support — LXC/cgroup + xt_qtaguid compatibility patches
        if: ${{ env.CONTAINER_MODE != '0' }}
        run: |
          set -euo pipefail

          COMMON=kernel_workspace/kernel_platform/common

          # (A) LXC 兼容：为 cgroup v1 的子系统文件额外建立 "<ss>.<file>" 软链。
          #     Android 以 noprefix 方式挂载 cgroup v1，systemd/LXC 会按 "memory.limit_in_bytes"
          #     这类前缀名查找文件，缺链接就会判定 cgroup 不可用。
          #     非 Docker 必需项，因此这里做「尽力而为」注入：失败只告警，不阻断构建。
          CGROUP_C="$COMMON/kernel/cgroup/cgroup.c"
          if [ -f "$CGROUP_C" ]; then
            python3 - "$CGROUP_C" <<'PY' || echo "⚠️ cgroup 前缀兼容补丁未应用（不影响内核编译）"
          import sys

          path = sys.argv[1]
          raw = open(path, encoding="utf-8", newline="").read()
          had_crlf = "\r\n" in raw
          text = raw.replace("\r\n", "\n").replace("\r", "\n")

          marker = "/* OnePlusPad2Pro: cgroup v1 noprefix 兼容软链 */"
          if marker in text:
              print("cgroup 前缀兼容补丁已存在")
              raise SystemExit(0)

          # 必须精确落在 cgroup_add_file() 内：cgroup_rm_file() 里也有同样的
          # spin_lock_irq(&cgroup_file_kn_lock) 代码块，只按块匹配会打错位置。
          # 该函数签名是 GKI 6.6 的形式（无 kn 参数）；老内核是 5 参数版本。
          fn = re.search(
              r"static int cgroup_add_file\([^)]*\)\n\{\n",
              text,
          )
          if not fn:
              print("未找到 cgroup_add_file()（函数签名与预期不符）")
              raise SystemExit(1)
          fn_end = text.find("\n}\n", fn.end())
          if fn_end < 0:
              print("未定位到 cgroup_add_file() 函数结尾")
              raise SystemExit(1)

          lock_block = re.compile(
              r"(?P<i>[ \t]*)spin_lock_irq\(&cgroup_file_kn_lock\);\n"
              r"[ \t]*cfile->kn = kn;\n"
              r"[ \t]*spin_unlock_irq\(&cgroup_file_kn_lock\);\n"
          )
          hit = lock_block.search(text, fn.end(), fn_end)
          if not hit:
              print("未在 cgroup_add_file() 内找到 cfile->kn = kn 注入锚点")
              raise SystemExit(1)

          indent = hit.group("i")
          injection = (
              f"{indent}{marker}\n"
              f"{indent}if (cft->ss && (cgrp->root->flags & CGRP_ROOT_NOPREFIX) &&\n"
              f"{indent}    !(cft->flags & CFTYPE_NO_PREFIX)) {{\n"
              f"{indent}\tsnprintf(name, CGROUP_FILE_NAME_MAX, \"%s.%s\",\n"
              f"{indent}\t\t cft->ss->name, cft->name);\n"
              f"{indent}\tkernfs_create_link(cgrp->kn, name, kn);\n"
              f"{indent}}}\n"
          )
          text = text[: hit.end()] + injection + text[hit.end():]
          if had_crlf:
              text = text.replace("\n", "\r\n")
          with open(path, "w", encoding="utf-8", newline="") as fh:
              fh.write(text)
          print("已注入 cgroup v1 noprefix 前缀软链")
          PY
            grep -q "cgroup v1 noprefix 兼容软链" "$CGROUP_C" || echo "⚠️ 未注入 cgroup 前缀兼容软链"
          else
            echo "⚠️ 未找到 $CGROUP_C，跳过"
          fi

          # (B) xt_qtaguid 空指针修复：老内核上跑容器会因 dev_get_stats 触发空指针而重启。
          #     6.6 GKI 已移除该驱动（Android 10 起弃用），因此仅在文件存在时尽力修复，
          #     失败只告警，避免为一个本就不存在的文件阻断构建。
          QTAGUID="$COMMON/net/netfilter/xt_qtaguid.c"
          if [ ! -f "$QTAGUID" ]; then
            echo "ℹ️ 未找到 xt_qtaguid.c（6.6 已移除该驱动），无需处理"
          else
            python3 - "$QTAGUID" <<'PY' || echo "⚠️ xt_qtaguid 补丁未应用（不影响内核编译）"
          import re
          import sys

          path = sys.argv[1]
          raw = open(path, encoding="utf-8", newline="").read()
          had_crlf = "\r\n" in raw
          text = raw.replace("\r\n", "\n").replace("\r", "\n")

          # 成员声明：去掉 dev_stats 局部变量
          text, n1 = re.subn(
              r"(?m)^([ \t]*)struct rtnl_link_stats64 dev_stats, \*stats;[ \t]*$",
              r"\1struct rtnl_link_stats64 *stats;",
              text,
              count=1,
          )

          # 分支：不再调用 dev_get_stats()，直接用 no_dev_stats
          text, n2 = re.subn(
              r"(?m)^([ \t]*)if \(iface_entry->active\) \{[ \t]*\n"
              r"[ \t]*stats = dev_get_stats\(iface_entry->net_dev,[ \t]*\n?[ \t]*&dev_stats\);[ \t]*\n"
              r"[ \t]*\} else \{[ \t]*\n"
              r"[ \t]*stats = &no_dev_stats;[ \t]*\n"
              r"[ \t]*\}[ \t]*\n",
              r"\1stats = &no_dev_stats;\n",
              text,
              count=1,
          )

          if n1 != 1 or n2 != 1:
              print(f"未能完成 xt_qtaguid 修复（声明 {n1} 处 / 分支 {n2} 处）")
              raise SystemExit(1)

          if had_crlf:
              text = text.replace("\n", "\r\n")
          with open(path, "w", encoding="utf-8", newline="") as fh:
              fh.write(text)
          print("xt_qtaguid 空指针修复已应用")
          PY
            echo "ℹ️ xt_qtaguid 处理结束"
          fi

          # 记录 kABI 槽位使用全貌，便于换用其它 CONTAINER_MODE 时排查
          echo "---- 内核树内所有 ANDROID_KABI_USE/_ANDROID_KABI_REPLACE 引用 ----"
          grep -rn "ANDROID_KABI_USE\|_ANDROID_KABI_REPLACE" "$COMMON" \
            --include=*.c --include=*.h 2>/dev/null | head -n 40 || true
          echo "---- sched.h 中 kABI 槽位数量 ----"
          grep -c "ANDROID_KABI_RESERVE(" "$COMMON/include/linux/sched.h" || true

      - name: Apply SUSFS patches
        run: |
          set -euo pipefail

          cd kernel_workspace

          if [ "${SUSFS_META}" = "-1" ]; then
            echo "⏭️ SUSFS 已禁用"
            # 后续步骤用 ${{ env.SUSVER }} / ${{ env.SUSFS_BRANCH_NAME }} 渲染 Release 与摘要，
            # 这里补上占位值，避免禁用 SUSFS 时这两处渲染成空字符串
            {
              echo "SUSVER=noSUSFS"
              echo "SUSFS_BRANCH_NAME=none"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          SUSFS_BRANCH="gki-${KANDROID_VERSION}-${KERNEL_VERSION}"
          git clone --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

          cd susfs4ksu
          if [ -n "${SUSFS_META}" ]; then
            if [[ "$SUSFS_META" =~ ^[0-9]+$ ]]; then
              git fetch --depth=50 origin "$SUSFS_BRANCH"
              git checkout "HEAD~${SUSFS_META}"
            else
              git fetch --depth=50 origin "$SUSFS_META" 2>/dev/null || true
              git checkout "$SUSFS_META"
            fi
          fi

          SUSFS_COMMIT_SHA="$(git rev-parse HEAD)"
          SUSFS_SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          SUSFS_PATCH="50_add_susfs_in_gki-${KANDROID_VERSION}-${KERNEL_VERSION}.patch"

          SUSVER="$(grep -RhoE 'SUSFS_VERSION[[:space:]]*["= ]+[vV]?[0-9]+\.[0-9]+\.[0-9]+[+A-Za-z0-9._-]*' . 2>/dev/null \
            | head -n1 | grep -oE '[vV]?[0-9]+\.[0-9]+\.[0-9]+[+A-Za-z0-9._-]*' || true)"
          [ -n "$SUSVER" ] || SUSVER="unknown-${SUSFS_SHORT_SHA}"

          {
            echo "SUSFS_BRANCH_NAME=${SUSFS_BRANCH}"
            echo "SUSFS_PATCH=${SUSFS_PATCH}"
            echo "SUSFS_COMMIT_SHA=${SUSFS_COMMIT_SHA}"
            echo "SUSFS_SHORT_SHA=${SUSFS_SHORT_SHA}"
            echo "SUSVER=${SUSVER}"
          } >> "$GITHUB_ENV"

          cd ..

          [ -f "./susfs4ksu/kernel_patches/${SUSFS_PATCH}" ] || { echo "❌ 找不到 ${SUSFS_PATCH}"; exit 1; }

          cp "./susfs4ksu/kernel_patches/${SUSFS_PATCH}" ./kernel_platform/common/
          cp ./susfs4ksu/kernel_patches/fs/* ./kernel_platform/common/fs/
          cp ./susfs4ksu/kernel_patches/include/linux/* ./kernel_platform/common/include/linux/

          cd kernel_platform/common

          # 先 dry-run，再真正应用，避免 patch 半途失败留下脏树
          if patch -p1 --dry-run -F 3 < "$SUSFS_PATCH" >/dev/null 2>&1; then
            patch -p1 -F 3 < "$SUSFS_PATCH"
            echo "✅ SUSFS 补丁应用成功"
          elif patch -p1 -R --dry-run -F 3 < "$SUSFS_PATCH" >/dev/null 2>&1; then
            echo "✅ SUSFS 补丁已应用，跳过"
          else
            echo "❌ SUSFS 补丁无法应用"
            exit 1
          fi

          echo "✅ SUSFS ${SUSVER} (${SUSFS_BRANCH}) @ ${SUSFS_COMMIT_SHA}"

      - name: Apply zram (lz4k / lz4kd) patches
        run: |
          set -euo pipefail

          cd kernel_workspace
          [ -d "SukiSU_patch" ] || git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git

          cd kernel_platform/common

          for src in include/linux lib crypto; do
            [ -d "../../SukiSU_patch/other/zram/lz4k/$src" ] && \
              cp -r "../../SukiSU_patch/other/zram/lz4k/$src/." "./$src/"
          done
          [ -d "../../SukiSU_patch/other/zram/lz4k_oplus" ] && \
            cp -r ../../SukiSU_patch/other/zram/lz4k_oplus ./lib/

          LZ4KD_PATCH="../../SukiSU_patch/other/zram/zram_patch/${KERNEL_VERSION}/lz4kd.patch"
          if [ -f "$LZ4KD_PATCH" ]; then
            if patch -p1 --dry-run -F 3 < "$LZ4KD_PATCH" >/dev/null 2>&1; then
              patch -p1 -F 3 < "$LZ4KD_PATCH"
              echo "✅ lz4kd 补丁应用成功"
            else
              echo "⚠️ lz4kd 补丁未应用（可能不适用于当前内核）"
            fi
          else
            echo "⚠️ 未找到 $LZ4KD_PATCH"
          fi

      - name: Apply HMBird GKI patch
        run: |
          set -euo pipefail

          cd kernel_workspace/kernel_platform/common/drivers
          cat << 'EOF' > hmbird_patch.c
          #include <linux/init.h>
          #include <linux/module.h>
          #include <linux/of.h>
          #include <linux/slab.h>
          #include <linux/string.h>

          static int __init hmbird_patch_init(void)
          {
              struct device_node *ver_np;
              const char *type;
              int ret;

              ver_np = of_find_node_by_path("/soc/oplus,hmbird/version_type");
              if (!ver_np) {
                   pr_info("hmbird_patch: version_type node not found\n");
                   return 0;
              }

              ret = of_property_read_string(ver_np, "type", &type);
              if (ret) {
                   pr_info("hmbird_patch: type property not found\n");
                   of_node_put(ver_np);
                   return 0;
              }

              if (strcmp(type, "HMBIRD_OGKI")) {
                   of_node_put(ver_np);
                   return 0;
              }

              struct property *prop = of_find_property(ver_np, "type", NULL);
              if (prop) {
                   struct property *new_prop = kmalloc(sizeof(*prop), GFP_KERNEL);
                   if (!new_prop) {
                        pr_info("hmbird_patch: kmalloc for new_prop failed\n");
                        of_node_put(ver_np);
                        return 0;
              }
              memcpy(new_prop, prop, sizeof(*prop));
              new_prop->value = kmalloc(strlen("HMBIRD_GKI") + 1, GFP_KERNEL);
              if (!new_prop->value) {
                   pr_info("hmbird_patch: kmalloc for new_prop->value failed\n");
                   kfree(new_prop);
                   of_node_put(ver_np);
                   return 0;
             }
             strcpy(new_prop->value, "HMBIRD_GKI");
             new_prop->length = strlen("HMBIRD_GKI") + 1;

             if (of_remove_property(ver_np, prop) != 0) {
                  pr_info("hmbird_patch: of_remove_property failed\n");
                  return 0;
             }
             if (of_add_property(ver_np, new_prop) !=0) {
                  pr_info("hmbird_patch: of_add_property failed\n");
                  return 0;
             }
             pr_info("hmbird_patch: success from HMBIRD_OGKI to HMBIRD_GKI\n");
          }
          else {
              pr_info("hmbird_patch: type property structure not found\n");
          }
          of_node_put(ver_np);
          return 0;
          }
          early_initcall(hmbird_patch_init);
          MODULE_LICENSE("GPL");
          MODULE_AUTHOR("reigadegr");
          MODULE_DESCRIPTION("Forcefully convert HMBIRD_OGKI to HMBIRD_GKI.");
          EOF

          if ! grep -q "hmbird_patch.o" Makefile; then
            echo "obj-y += hmbird_patch.o" >> Makefile
          fi

      - name: Add sched_ext
        if: "${{ github.event_name == 'schedule' || inputs.enable_sched_ext == true }}"
        run: |
          set -euo pipefail

          cd kernel_workspace/kernel_platform
          git clone --depth=1 https://github.com/HanKuCha/sched_ext.git
          cp -r ./sched_ext/* ./common/kernel/sched
          rm -rf ./sched_ext/.git
          echo "✅ sched_ext 已合入"

      - name: Configure kernel (defconfig)
        run: |
          set -euo pipefail

          cd kernel_workspace/kernel_platform
          CONFIG=./common/arch/arm64/configs/gki_defconfig

          force_config() {
            local entry="$1" key="${1%%=*}"
            sed -i "/^${key}=/d" "$CONFIG" 2>/dev/null || true
            echo "$entry" >> "$CONFIG"
          }

          append_config() {
            local entry="$1" key="${1%%=*}"
            grep -qE "^${key}=" "$CONFIG" 2>/dev/null || echo "$entry" >> "$CONFIG"
          }

          # 覆盖已有配置，包括 "# CONFIG_X is not set" 这种被显式关闭的形式
          # （stock gki_defconfig 里 PID_NS / FHANDLE 等就是用这种写法关掉的）
          force_set() {
            local symbol="${1%%=*}"
            sed -i -E "/^(# )?${symbol}[ =]/d" "$CONFIG" 2>/dev/null || true
            echo "$1" >> "$CONFIG"
          }

          # 只在源码 Kconfig 里确实定义了该符号时才开启，避免写进无效条目后
          # 被 olddefconfig 静默丢弃，也避免误判「已开启」。
          # 先把所有 Kconfig 符号名缓存成一份清单，避免每个选项都全树 grep。
          KCONFIG_SYMS="$(mktemp)"
          find ./common -name 'Kconfig*' -type f -print0 2>/dev/null \
            | xargs -0 grep -hE '^[[:space:]]*(menuconfig|config)[[:space:]]+[A-Za-z0-9_]+' 2>/dev/null \
            | sed -E 's/.*[[:space:]]+([A-Za-z0-9_]+)[[:space:]]*$/\1/' | sort -u > "$KCONFIG_SYMS" || true
          echo "  ℹ️  已缓存 $(wc -l < "$KCONFIG_SYMS") 个 Kconfig 符号"
          SKIPPED_SYMS=()

          ensure_config() {
            local entry="$1" symbol="${1%%=*}" name="${1%%=*}"
            name="${symbol#CONFIG_}"
            if grep -qxF "$name" "$KCONFIG_SYMS"; then
              force_set "$entry"
            else
              SKIPPED_SYMS+=("$symbol")
            fi
          }

          report_skipped() {
            if [ "${#SKIPPED_SYMS[@]}" -gt 0 ]; then
              echo "  ⚠️  以下符号在本内核 Kconfig 中不存在，已跳过：${SKIPPED_SYMS[*]}"
            else
              echo "  ✅ 所有容器相关符号都存在于本内核 Kconfig"
            fi
          }

          echo "# === ReSukiSU ===" >> "$CONFIG"
          append_config "CONFIG_KSU=y"
          append_config "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y"
          # ReSukiSU 自 2026-06 起已彻底移除 KPM/KernelPatch 支持，显式关闭避免残留
          force_config "CONFIG_KPM=n"

          if [ -n "${KSU_CUSTOM_TAG:-}" ]; then
            force_config "CONFIG_KSU_FULL_NAME_FORMAT=\"%TAG_NAME%-${KSU_CUSTOM_TAG}@main[%COMMIT_SHA%]\""
          fi

          if [ "${SUSFS_META}" != "-1" ]; then
            echo "# === SUSFS ===" >> "$CONFIG"
            append_config "CONFIG_KSU_SUSFS=y"
            append_config "CONFIG_KSU_SUSFS_SUS_PATH=y"
            append_config "CONFIG_KSU_SUSFS_SUS_MAP=y"
            append_config "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            append_config "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            append_config "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            append_config "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            append_config "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            append_config "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            # GKI 上开启会因符号裁剪导致 unresolved symbol，必须保持关闭
            force_config "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n"
          else
            force_config "CONFIG_KSU_SUSFS=n"
          fi

          echo "# === zram (lz4k / lz4kd) ===" >> "$CONFIG"
          append_config "CONFIG_CRYPTO_LZ4HC=y"
          append_config "CONFIG_CRYPTO_LZ4K=y"
          append_config "CONFIG_CRYPTO_LZ4KD=y"
          append_config "CONFIG_CRYPTO_842=y"

          echo "# === Network (BBR) ===" >> "$CONFIG"
          append_config "CONFIG_TCP_CONG_ADVANCED=y"
          append_config "CONFIG_TCP_CONG_BBR=y"
          append_config "CONFIG_NET_SCH_FQ=y"
          force_config "CONFIG_DEFAULT_TCP_CONG=\"bbr\""
          force_config "CONFIG_TCP_CONG_CUBIC=n"
          force_config "CONFIG_TCP_CONG_WESTWOOD=n"
          force_config "CONFIG_TCP_CONG_HTCP=n"
          force_config "CONFIG_TCP_CONG_BIC=n"

          echo "# === Kernel identity ===" >> "$CONFIG"
          force_config "CONFIG_LOCALVERSION=\"${KERNEL_SUFFIX}\""
          force_config "CONFIG_LOCALVERSION_AUTO=n"

          # ======================= 容器 / Docker 原生运行支持 =======================
          # 目标：让 moby check-config.sh 的 "Generally Necessary" 全绿，并满足
          # dockerd/containerd/runc 在 Android 上原生运行所需的一切内核能力。
          #
          # 特别说明（为什么这些项缺一不可）：
          #   * CONFIG_IPC_NS 依赖 SYSVIPC || POSIX_MQUEUE，两者都没开时 IPC namespace
          #     会直接变成 "required"，容器起不来。task_struct 偏移量问题由上面
          #     "kABI-safe SYSVIPC patch" 步骤解决。
          #   * CONFIG_CGROUP_DEVICE 提供 cgroup v1 devices 控制器，Docker 用它做设备白名单。
          #   * CONFIG_USER_NS 用于 rootless/非特权容器，并消除 "unsafe procfs" 报错。
          #   * OVERLAY_FS / VETH / BRIDGE / NF_NAT / MASQUERADE 分别对应 overlay2
          #     存储驱动、docker0 网桥、容器出网 NAT。
          # 特别说明（分档位的原因）：
          #   下面 <基础块> 是社区长期验证过、公认安全的容器配置，默认就开。
          #   <可选块> 里的项要么改 task_struct 布局（kABI），要么改开机路径行为，
          #   是「卡第一屏」的可疑对象，因此默认**不开**，由开关/档位逐项放行。
          #     基础块：namespace 基础、cgroup 基础、OVERLAY_FS、
          #             VETH/BRIDGE/DUMMY、IPv4 NAT/MASQUERADE、SECCOMP_FILTER
          #     可选块：SYSVIPC(kABI) POSIX_MQUEUE IPC_NS PID_NS CGROUP_DEVICE
          #             macvlan ipvlan IPv6 NAT 族 nf_tables FHANDLE diag 族
          if [ "${CONTAINER_MODE}" != "0" ]; then
            echo "# === Container / Docker support (level=${CONTAINER_LEVEL}) ===" >> "$CONFIG"

            # --- 命名空间 ---
            # NAMESPACES / UTS_NS / NET_NS 在 stock defconfig 里已开启，这里只做兜底
            ensure_config "CONFIG_NAMESPACES=y"
            ensure_config "CONFIG_UTS_NS=y"
            ensure_config "CONFIG_NET_NS=y"
            # USER_NS 用于 rootless/非特权容器，并消除 "unsafe procfs" 报错
            ensure_config "CONFIG_USER_NS=y"
            # Cgroup namespace 在部分 OnePlus 机型上会引发开机异常，默认不动
            echo "  ℹ️  CONFIG_CGROUP_NS 保持 stock 状态（避免卡开机）"
            # IPC_NS / PID_NS 见下方可选块（有依赖与开机风险）

            # --- cgroup 控制器 ---
            ensure_config "CONFIG_CGROUPS=y"
            ensure_config "CONFIG_MEMCG=y"
            ensure_config "CONFIG_CGROUP_SCHED=y"
            ensure_config "CONFIG_CGROUP_FREEZER=y"
            ensure_config "CONFIG_CGROUP_PIDS=y"
            ensure_config "CONFIG_CGROUP_BPF=y"
            ensure_config "CONFIG_CPUSETS=y"
            ensure_config "CONFIG_BLK_CGROUP=y"
            ensure_config "CONFIG_CGROUP_CPUACCT=y"

            # ⚠️ 最高风险项，单独一档：
            #    一加/OPPO 设备上「开启 Device controller 后无法开机」是有据可查的，
            #    AOSP GKI 也刻意不默认开它。Docker 只靠它做设备白名单，
            #    缺了可以用 --privileged 或自定义 device cgroup 规则绕过，
            #    因此默认关闭，确认能开机后再单独打开验证。
            if [ "${CGROUP_DEVICE_CONTROLLER}" = "true" ]; then
              ensure_config "CONFIG_CGROUP_DEVICE=y"
            else
              echo "  ⏭️  跳过 CONFIG_CGROUP_DEVICE（默认关闭；需要设备白名单时再开）"
            fi

            # --- 存储驱动 overlay2 ---
            ensure_config "CONFIG_OVERLAY_FS=y"
            ensure_config "CONFIG_TMPFS=y"
            ensure_config "CONFIG_TMPFS_XATTR=y"
            ensure_config "CONFIG_TMPFS_POSIX_ACL=y"
            ensure_config "CONFIG_DEVTMPFS=y"

            # --- 容器网络：网桥 / veth（Docker 默认 bridge 网络的必备项）---
            ensure_config "CONFIG_VETH=y"
            ensure_config "CONFIG_BRIDGE=y"
            ensure_config "CONFIG_BRIDGE_NETFILTER=y"
            ensure_config "CONFIG_DUMMY=y"

            # --- netfilter / iptables：NAT、端口映射、连接跟踪 ---
            ensure_config "CONFIG_NETFILTER=y"
            ensure_config "CONFIG_NETFILTER_ADVANCED=y"
            ensure_config "CONFIG_NF_CONNTRACK=y"
            ensure_config "CONFIG_NF_NAT=y"
            ensure_config "CONFIG_NETFILTER_XTABLES=y"
            ensure_config "CONFIG_NETFILTER_XT_MATCH_COMMENT=y"
            ensure_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            ensure_config "CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y"
            ensure_config "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y"
            ensure_config "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y"
            ensure_config "CONFIG_NETFILTER_XT_NAT=y"

            # 容器出网 / 端口发布（IPv4）
            ensure_config "CONFIG_IP_NF_IPTABLES=y"
            ensure_config "CONFIG_IP_NF_FILTER=y"
            ensure_config "CONFIG_IP_NF_NAT=y"
            ensure_config "CONFIG_IP_NF_TARGET_MASQUERADE=y"
            ensure_config "CONFIG_IP_NF_TARGET_REDIRECT=y"
            ensure_config "CONFIG_IP_NF_MANGLE=y"
            ensure_config "CONFIG_IP_ADVANCED_ROUTER=y"
            ensure_config "CONFIG_IP_MULTIPLE_TABLES=y"

            # --- runc / seccomp：容器默认 seccomp profile 依赖 ---
            ensure_config "CONFIG_SECCOMP=y"
            ensure_config "CONFIG_SECCOMP_FILTER=y"

            # ============ 以下为可选增强，按档位/开关决定是否加入 ============
            # 这些要么改 task_struct 布局（kABI 风险），要么改开机路径上的行为，
            # 要么只是"更好用"而非"必需"。默认全部不加，
            # 等 minimal 档确认能正常开机后再逐档打开，避免又一次卡第一屏。
            EXTRA_LEVEL=0
            [ "${CONTAINER_LEVEL}" = "standard" ] && EXTRA_LEVEL=1
            [ "${CONTAINER_LEVEL}" = "full" ] && EXTRA_LEVEL=2

            if [ "${CONTAINER_LEVEL}" = "minimal" ]; then
              echo "  ℹ️  CONTAINER_LEVEL=minimal：跳过以下高风险/可选配置："
              echo "      FHANDLE PID_NS 覆盖 macvlan ipvlan IPv6 NAT 族 nf_tables"
              echo "      XT_TARGET_CHECKSUM diag 族"
              echo "      （POSIX_MQUEUE / IPC_NS 不受档位影响，始终开启 —— Docker 必需）"
              echo "      → 先只验证这一版能不能开机；能开机再换 standard/full 逐档加回"
            fi

            # (1) IPC namespace —— Docker **必需**，且必须走"不碰 task_struct"的路。
            #
            #   Kconfig 事实：CONFIG_IPC_NS depends on (SYSVIPC || POSIX_MQUEUE)
            #   —— 二选一即可满足依赖。
            #
            #   这两条路的差别是本机型"卡第一屏"的关键：
            #     SYSVIPC      会给 struct task_struct 加 sysvsem/sysvshm 两个成员，
            #                  顶掉其后所有字段偏移量 → 必须配 kABI 槽位补丁，
            #                  而槽位选错就是无限重启在第一屏。
            #     POSIX_MQUEUE 在 6.6 上**不给 task_struct 增加任何字段**（已核实），
            #                  因此不产生 kABI 偏移问题，也不依赖补丁。
            #
            #   → 安全模式（container_mode=4）走 POSIX_MQUEUE：拿到 IPC_NS，
            #     代价是**放弃 SysV IPC**（信号量/共享内存），少数镜像会受影响。
            #   → 想要完整 SysV IPC 再切 container_mode=1/2/3 并配 risky_container_extras=true。
            if [ "${CONTAINER_IPC_NS}" = "true" ]; then
              ensure_config "CONFIG_POSIX_MQUEUE=y"
              ensure_config "CONFIG_IPC_NS=y"
              echo "  ✅ IPC_NS 走 POSIX_MQUEUE（不碰 task_struct，无 kABI 风险）"
            else
              echo "  ⏭️  按输入跳过 IPC_NS（Docker/containerd/runc 会因缺 IPC namespace 启动失败）"
            fi

            # (2) 完整 SysV IPC：仅 1/2/3 档 + risky 开关才开。
            #     ⚠️ 必须与 kABI 补丁同步：只开 SYSVIPC 而不打补丁 = 偏移量必被顶掉 = 卡第一屏。
            if [ "${CONTAINER_MODE}" != "0" ] && [ "${CONTAINER_MODE}" != "4" ] && [ "${RISKY_CONTAINER_EXTRAS}" = "true" ]; then
              ensure_config "CONFIG_SYSVIPC=y"
              echo "  ✅ 开启 SYSVIPC（已由 kABI 补丁把 sysvsem/sysvshm 放入槽位 ${CONTAINER_MODE}）"
            else
              echo "  ⏭️  不开 CONFIG_SYSVIPC（保持 task_struct 布局不变；IPC_NS 由 POSIX_MQUEUE 提供）"
            fi

            # (3) PID namespace：stock defconfig 里被显式关掉（# CONFIG_PID_NS is not set），
            #     打开它会改变开机时进程创建的命名空间行为，属于中风险。
            if [ "${RISKY_CONTAINER_EXTRAS}" = "true" ]; then
              ensure_config "CONFIG_PID_NS=y"
            else
              echo "  ⏭️  跳过 CONFIG_PID_NS（容器仍可用 --pid=host 或共享 host pid ns）"
            fi

            # (4) 额外网络驱动与诊断接口：不影响开机，纯粹"更好用"
            if [ "${EXTRA_LEVEL}" -ge 1 ]; then
              ensure_config "CONFIG_MACVLAN=y"
              ensure_config "CONFIG_IPVLAN=y"
              ensure_config "CONFIG_NF_TABLES=y"
              ensure_config "CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y"
              ensure_config "CONFIG_IP6_NF_IPTABLES=y"
              ensure_config "CONFIG_IP6_NF_FILTER=y"
              ensure_config "CONFIG_IP6_NF_MANGLE=y"
              ensure_config "CONFIG_IP6_NF_NAT=y"
              ensure_config "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
              ensure_config "CONFIG_IP_NF_MATCH_ECN=y"
              ensure_config "CONFIG_IP_NF_MATCH_TTL=y"
              ensure_config "CONFIG_AUDIT=y"
              ensure_config "CONFIG_EVENTFD=y"
              ensure_config "CONFIG_EPOLL=y"
            fi
            if [ "${RISKY_CONTAINER_EXTRAS}" = "true" ] || [ "${EXTRA_LEVEL}" -ge 1 ]; then
              ensure_config "CONFIG_FHANDLE=y"
              ensure_config "CONFIG_UNIX_DIAG=y"
              ensure_config "CONFIG_INET_DIAG=y"
              ensure_config "CONFIG_PACKET_DIAG=y"
              ensure_config "CONFIG_NETLINK_DIAG=y"
            fi

            echo "  📋 本档位：mode=${CONTAINER_MODE} level=${CONTAINER_LEVEL} ipc_ns=${CONTAINER_IPC_NS} device_controller=${CGROUP_DEVICE_CONTROLLER} risky_extras=${RISKY_CONTAINER_EXTRAS}"
            echo "# === end container / Docker support ===" >> "$CONFIG"
            report_skipped
          else
            echo "⏭️ CONTAINER_MODE=0：不加入容器/Docker 内核配置"
          fi
          rm -f "$KCONFIG_SYMS"

          # 防止 setlocalversion 在 git 树 dirty 时追加 '+'，导致内核版本变成 6.6.57-Elaina-ExceSama+
          if [ -f ./common/scripts/setlocalversion ]; then
            sed -i 's/echo "+"/:/g; s/echo +/:/g' ./common/scripts/setlocalversion || true
          fi

          # 移除 check_defconfig 避免 defconfig 一致性检查失败
          sed -i 's/check_defconfig//' ./common/build.config.gki || true

      - name: Verify important config entries
        run: |
          set -euo pipefail

          cd kernel_workspace/kernel_platform
          CONFIG_FILE="./common/arch/arm64/configs/gki_defconfig"

          echo "🔎 关键 defconfig 条目:"
          grep -nE 'CONFIG_KSU=|CONFIG_KSU_MULTI_MANAGER_SUPPORT=|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=|CONFIG_KPM=|CONFIG_TCP_CONG_BBR=|CONFIG_KSU_FULL_NAME_FORMAT=' "$CONFIG_FILE" || true

          grep -q '^CONFIG_KSU=y' "$CONFIG_FILE" || { echo "❌ CONFIG_KSU=y 缺失"; exit 1; }
          if grep -q '^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' "$CONFIG_FILE"; then
            echo "❌ CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS 不应为 y"
            exit 1
          fi
          if grep -q '^CONFIG_KPM=y' "$CONFIG_FILE"; then
            echo "❌ CONFIG_KPM=y 不应存在（KPM 支持已移除）"
            exit 1
          fi

      - name: Generate kernel configuration (gki_defconfig)
        run: |
          set -euo pipefail

          cd kernel_workspace/kernel_platform

          # 单独生成 .config：这样可以在真正花 1~2 小时编译之前，
          # 先检查容器/Docker 相关配置有没有被 Kconfig 依赖过滤掉。
          export PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r510928/bin:$PATH"

          cd common
          make -j"$(nproc --all)" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang \
            RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc \
            PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole \
            LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS_PERF+=-O3 \
            gki_defconfig

          echo "✅ 已生成 out/.config"

      - name: Verify container / Docker config (hard gate)
        if: ${{ env.CONTAINER_MODE != '0' }}
        run: |
          set -euo pipefail

          DOTCONFIG=kernel_workspace/kernel_platform/common/out/.config
          [ -f "$DOTCONFIG" ] || { echo "❌ 找不到 $DOTCONFIG"; exit 1; }

          docker_state() {
            grep -qE "^$1=y" "$DOTCONFIG" && echo "y" || echo "n"
          }

          # 只要求「当前档位下我们主动开启过」的项；未开启的档位不强求。
          # 否则 minimal 档会因为没开 SYSVIPC/PID_NS 而被误判为失败。
          REQUIRED=(
            CONFIG_NAMESPACES CONFIG_UTS_NS CONFIG_NET_NS CONFIG_USER_NS
            CONFIG_CGROUPS CONFIG_CGROUP_SCHED CONFIG_CGROUP_PIDS CONFIG_CPUSETS
            CONFIG_MEMCG CONFIG_BLK_CGROUP CONFIG_CGROUP_BPF
            CONFIG_OVERLAY_FS
            CONFIG_VETH CONFIG_BRIDGE
            CONFIG_NETFILTER CONFIG_NF_CONNTRACK CONFIG_NF_NAT
            CONFIG_IP_NF_IPTABLES CONFIG_IP_NF_NAT
            CONFIG_IP_NF_TARGET_MASQUERADE CONFIG_NETFILTER_XT_TARGET_MASQUERADE
            CONFIG_SECCOMP CONFIG_SECCOMP_FILTER
          )

          # 按档位追加"本次应当生效"的项
          EXTRA_LEVEL=0
          [ "${CONTAINER_LEVEL}" = "standard" ] && EXTRA_LEVEL=1
          [ "${CONTAINER_LEVEL}" = "full" ] && EXTRA_LEVEL=2

          # IPC namespace：CONTAINER_IPC_NS=true 时走 POSIX_MQUEUE，两者都必须实际生效
          if [ "${CONTAINER_IPC_NS}" = "true" ]; then
            REQUIRED+=(CONFIG_POSIX_MQUEUE CONFIG_IPC_NS)
          else
            echo "ℹ️  CONTAINER_IPC_NS=false：IPC_NS 未开启，不作要求（容器需 --ipc=host）"
          fi

          # SYSVIPC 仅在 kABI 模式（1/2/3）且开 risky 时才要求。
          # ⚠️ 反向校验同样重要：安全模式/关闭模式下任务必须**没有** SYSVIPC，
          #    否则说明 config 逻辑写漏了，task_struct 会在没打补丁的情况下被改布局 → 卡第一屏。
          if [ "${CONTAINER_MODE}" != "0" ] && [ "${CONTAINER_MODE}" != "4" ] && [ "${RISKY_CONTAINER_EXTRAS}" = "true" ]; then
            REQUIRED+=(CONFIG_SYSVIPC CONFIG_PID_NS)
          else
            echo "ℹ️  未开启 SYSVIPC 档位：不作要求"
            if [ "$(docker_state CONFIG_SYSVIPC)" = "y" ]; then
              echo "❌ CONFIG_SYSVIPC=y 但本次没有走 kABI 补丁（container_mode=${CONTAINER_MODE}）！"
              echo "   task_struct 布局已被改动却没有槽位补丁，刷入必然卡第一屏，拒绝继续。"
              exit 1
            fi
            echo "✅ 已确认 CONFIG_SYSVIPC 未开启（task_struct 布局未被改动）"
          fi

          if [ "${RISKY_CONTAINER_EXTRAS}" = "true" ] || [ "${EXTRA_LEVEL}" -ge 1 ]; then
            REQUIRED+=(CONFIG_FHANDLE)
          fi
          if [ "${EXTRA_LEVEL}" -ge 1 ]; then
            REQUIRED+=(CONFIG_MACVLAN CONFIG_IPVLAN)
          fi
          if [ "${CGROUP_DEVICE_CONTROLLER}" = "true" ]; then
            REQUIRED+=(CONFIG_CGROUP_DEVICE)
          fi

          # 影响体验但非致命，缺失只告警
          OPTIONAL=(
            CONFIG_IPC_NS CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_PID_NS
            CONFIG_CGROUP_DEVICE CONFIG_FHANDLE
            CONFIG_BRIDGE_NETFILTER CONFIG_DUMMY CONFIG_NETFILTER_ADVANCED
            CONFIG_IP6_NF_NAT CONFIG_IP6_NF_TARGET_MASQUERADE CONFIG_NF_TABLES
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE CONFIG_NETFILTER_XT_TARGET_CHECKSUM
            CONFIG_UNIX_DIAG CONFIG_PACKET_DIAG CONFIG_NETLINK_DIAG CONFIG_INET_DIAG
            CONFIG_MACVLAN CONFIG_IPVLAN
            CONFIG_TMPFS_POSIX_ACL CONFIG_TMPFS_XATTR CONFIG_DEVTMPFS
            CONFIG_IP_ADVANCED_ROUTER CONFIG_IP_MULTIPLE_TABLES
          )

          echo "| 配置项 | 状态 | 说明 |"
          echo "|--------|------|------|"

          FAILED=()
          for s in "${REQUIRED[@]}"; do
            v="$(docker_state "$s")"
            if [ "$v" = "y" ]; then
              echo "✅ $s=y"
            else
              echo "❌ $s 未生效（必需）"
              FAILED+=("$s")
            fi
          done

          for s in "${OPTIONAL[@]}"; do
            v="$(docker_state "$s")"
            [ "$v" = "y" ] && echo "✅ $s=y" || echo "⚠️  $s 未生效（可选）"
          done

          echo "🔎 kABI padding 槽位占用情况:"
          grep -n "ANDROID_KABI_USE\|_ANDROID_KABI_REPLACE" \
            kernel_workspace/kernel_platform/common/include/linux/sched.h || true

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "❌ 以下容器必需内核配置未生效：${FAILED[*]}"
            echo "   常见原因：前置依赖未开启，或该符号在本内核树中不存在。"
            exit 1
          fi

          echo "✅ 本档位（level=${CONTAINER_LEVEL} device_ctrl=${CGROUP_DEVICE_CONTROLLER} risky=${RISKY_CONTAINER_EXTRAS}）必需项全部就绪"

      - name: Commit modifications to clean tree
        run: |
          set -euo pipefail

          cd kernel_workspace/kernel_platform
          git add -A
          git commit -m "Apply ReSukiSU, SUSFS and config changes" || true

          cd common
          git add -A
          git commit -m "Apply ReSukiSU, SUSFS and config changes" || true

      - name: Build kernel
        run: |
          set -euo pipefail

          cd kernel_workspace/kernel_platform

          export KBUILD_BUILD_TIMESTAMP="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
          export KBUILD_BUILD_VERSION=1
          # 不要再 export LOCALVERSION：setlocalversion 会同时拼接
          # ${config_localversion} 与 ${LOCALVERSION}，而 defconfig 里已经写了
          # CONFIG_LOCALVERSION="${KERNEL_SUFFIX}"，两者同时存在会让后缀重复两遍
          export PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r510928/bin:$PATH"
          export PATH="/usr/lib/ccache:$PATH"

          cd common
          # .config 已在 "Generate kernel configuration" 步骤生成并校验过，
          # 这里只跑 all，避免重复执行 defconfig 覆盖掉已校验的配置。
          make -j"$(nproc --all)" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang \
            RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc \
            PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole \
            LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS_PERF+=-O3 \
            all

          echo "🏷️ 内核版本字符串:"
          cat out/include/config/kernel.release 2>/dev/null || true

      - name: Prepare AnyKernel3
        run: |
          set -euo pipefail

          IMAGE="kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image"
          [ -f "$IMAGE" ] || { echo "❌ 找不到内核 Image"; exit 1; }

          # 使用 Bouteillepleine/AnyKernel3，分支 gki-2.0
          AK3_REPO="https://github.com/Bouteillepleine/AnyKernel3"
          AK3_BRANCH="gki-2.0"

          rm -rf ./AnyKernel3
          git clone --depth=1 -b "$AK3_BRANCH" "$AK3_REPO" ./AnyKernel3

          [ -f ./AnyKernel3/anykernel.sh ] || { echo "❌ AnyKernel3 获取失败：缺少 anykernel.sh"; exit 1; }

          rm -rf ./AnyKernel3/.git
          cp "$IMAGE" ./AnyKernel3/Image
          ls -la ./AnyKernel3 | head -20

          echo "IMAGE_SHA256=$(sha256sum ./AnyKernel3/Image | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Zip AnyKernel3
        run: |
          set -euo pipefail

          if [ "${SUSFS_META}" = "-1" ]; then
            SUSFS_ZIP_PART="noSUSFS"
          else
            SUSFS_ZIP_PART="SUSFS-${SUSVER:-unknown}"
          fi

          if [ "${CONTAINER_MODE}" = "0" ]; then
            CONTAINER_ZIP_PART="noDocker"
            CONTAINER_LABEL="关闭"
          else
            # 把档位与两个风险开关编进文件名/标签：
            # 二分排查时要一眼看出手上这个 zip 到底是哪一档，否则很容易刷错包。
            CONTAINER_ZIP_PART="Docker-${CONTAINER_LEVEL}"
            [ "${CGROUP_DEVICE_CONTROLLER}" = "true" ] && CONTAINER_ZIP_PART="${CONTAINER_ZIP_PART}-devctl"
            # 安全模式（4）单独标出来：这是"不碰 task_struct"的版本，最容易开机
            if [ "${CONTAINER_MODE}" = "4" ]; then
              CONTAINER_ZIP_PART="${CONTAINER_ZIP_PART}-safe"
            elif [ "${RISKY_CONTAINER_EXTRAS}" = "true" ]; then
              CONTAINER_ZIP_PART="${CONTAINER_ZIP_PART}-kABI${CONTAINER_MODE}"
            fi
            [ "${CONTAINER_IPC_NS}" = "true" ] && CONTAINER_ZIP_PART="${CONTAINER_ZIP_PART}-ipcns"
            CONTAINER_LABEL="Docker/LXC（${CONTAINER_LEVEL} · devices=${CGROUP_DEVICE_CONTROLLER} · risky=${RISKY_CONTAINER_EXTRAS}）"
          fi

          {
            echo "CONTAINER_ZIP_PART=${CONTAINER_ZIP_PART}"
            echo "CONTAINER_LABEL=${CONTAINER_LABEL}"
          } >> "$GITHUB_ENV"

          ZIP_NAME="AK3_ReSukiSU_${KSUVER}_${SUSFS_ZIP_PART}_${CONTAINER_ZIP_PART}_${DEVICE_NAME_SAFE}_${TKERNEL_VERSION}.zip"
          echo "📦 打包: $ZIP_NAME"

          cd AnyKernel3
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" . -x "*.git*" -x "*.zip"
          cd ..

          {
            echo "ZIP_NAME=${ZIP_NAME}"
            echo "ZIP_SIZE=$(du -h "${GITHUB_WORKSPACE}/${ZIP_NAME}" | awk '{print $1}')"
            echo "ZIP_SHA256=$(sha256sum "${GITHUB_WORKSPACE}/${ZIP_NAME}" | awk '{print $1}')"
          } >> "$GITHUB_ENV"

          unzip -l "${GITHUB_WORKSPACE}/${ZIP_NAME}" | grep -E "(Image|anykernel\.sh)" || true

      - name: Upload AnyKernel3 as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DEVICE_NAME_SAFE }}_ReSukiSU_${{ env.KSUVER }}_${{ env.TKERNEL_VERSION }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
          if-no-files-found: error

      - name: Prepare release metadata (不按 tag 标识产物)
        run: |
          set -euo pipefail

          # 产物标识不再使用 tag / 版本号，统一以 ZIP_NAME 为准。
          # Release 只是"最近一次 pre 构建"的投放位：
          #   tag  → p<run_number>.<run_attempt>，仅保证唯一性，不含版本语义
          #   name → [pre] 日期 — 机型 — 容器档位（一眼看出是哪一档）
          # 旧写法 tag_name: "${KSUVER}" 会让同一个 KSUVER 的第二次构建
          # 直接失败在 "tag already exists"。
          {
            echo "RELEASE_TAG=p${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            echo "RELEASE_NAME=[pre] ${DATE} — ${DEVICE_NAME} — SUSFS ${SUSVER} — ${CONTAINER_ZIP_PART}"
          } >> "$GITHUB_ENV"

          echo "🏷️  Release tag : p${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}（仅唯一性，非产物标识）"
          echo "📛  Release name: [pre] ${DATE} — ${DEVICE_NAME} — SUSFS ${SUSVER} — ${CONTAINER_ZIP_PART}"
          echo "📦  产物标识    : ${ZIP_NAME}"

      - name: Create Release
        if: "${{ github.event_name == 'schedule' || inputs.create_release == true }}"
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ## 📦 ${{ env.DEVICE_NAME }} ReSukiSU 内核

            | 项目 | 值 |
            |------|-----|
            | 设备 | ${{ env.DEVICE_NAME }} (`${{ env.DEVICE_CODENAME }}`) |
            | 平台 | `${{ env.CPU }}` / `${{ env.KANDROID_VERSION }}` / `${{ env.TKERNEL_VERSION }}` |
            | 源码 | `OnePlusOSS/kernel_manifest` @ `oneplus/sm8750` (`oneplus_pad_2_pro.xml`) |
            | ReSukiSU | `${{ env.KSUVER }}` (`${{ env.KSU_COMMIT_SHA }}`) |
            | SUSFS | ${{ env.SUSVER }} — `${{ env.SUSFS_BRANCH_NAME }}` |
            | 内核后缀 | `${{ env.KERNEL_SUFFIX }}` |
            | 容器支持 | ${{ env.CONTAINER_LABEL }} |
            | 容器档位 | `container_mode=${{ env.CONTAINER_MODE }}` / `container_level=${{ env.CONTAINER_LEVEL }}` / `ipc_ns=${{ env.CONTAINER_IPC_NS }}` / `device_controller=${{ env.CGROUP_DEVICE_CONTROLLER }}` / `risky_extras=${{ env.RISKY_CONTAINER_EXTRAS }}` |
            | KPM | ❌ 已移除（ReSukiSU 上游不再支持） |
            | ZIP SHA256 | `${{ env.ZIP_SHA256 }}` |

            ### 🐳 容器 / Docker 支持（分档位，便于二分定位）

            本内核把容器相关内核配置按**风险**分档，默认只开公认安全的那批，
            目的是避免"一次全开 → 卡第一屏 → 完全不知道是哪一项"。

            | 档位 | 内容 |
            |------|------|
            | `minimal`（默认） | namespace 基础、cgroup 基础、`OVERLAY_FS`、`VETH`/`BRIDGE`/`DUMMY`、IPv4 NAT/MASQUERADE、`SECCOMP_FILTER` |
            | `standard` | + `POSIX_MQUEUE`/`IPC_NS`、macvlan/ipvlan、IPv6 NAT 族、nf_tables、XT_CHECKSUM、AUDIT/EVENTFD/EPOLL、FHANDLE、diag 族 |
            | `full` | 预留：再叠加显式开关 |

            两个独立开关（默认 **关**）控制高风险项：

            - `cgroup_device_controller` → `CONFIG_CGROUP_DEVICE`（cgroup v1 devices 控制器）
            - `risky_container_extras` → `CONFIG_SYSVIPC`（含 kABI 槽位补丁）、`CONFIG_PID_NS`、
              `FHANDLE`、diag 族

            #### 🛡️ `container_mode=4` 安全模式（默认，推荐先用这个）

            **完全不碰 `struct task_struct`**，从根上排除"卡第一屏"的头号原因：

            | | 安全模式 `4` | kABI 模式 `1/2/3` |
            |---|---|---|
            | `CONFIG_SYSVIPC` | ❌ 关闭（不改 `task_struct` 布局） | ✅ 开启 |
            | `task_struct` 补丁 | ❌ 不需要 | ✅ 改到 kABI padding 槽位 |
            | `CONFIG_POSIX_MQUEUE` | ✅ 开启 | ✅ 开启 |
            | `CONFIG_IPC_NS` | ✅ **仍然开启** | ✅ 开启 |
            | SysV IPC（信号量/共享内存） | ❌ 不可用 | ✅ 可用 |
            | 卡第一屏风险 | 低 | 取决于槽位是否选对 |

            原理：`CONFIG_IPC_NS` 的 Kconfig 依赖是 `(SYSVIPC || POSIX_MQUEUE)`，**二选一即可**；
            而 `POSIX_MQUEUE` 在 6.6 上不给 `task_struct` 增加任何字段，因此不产生 kABI 偏移问题。
            代价只有"放弃 SysV IPC"——`dockerd`/`containerd`/`runc` 本身不受影响，
            少数依赖 SysV 信号量/共享内存的镜像才需要切到 `1/2/3`。

            > ⚠️ **`CONFIG_CGROUP_DEVICE` 在 OnePlus/OPPO 上是有据可查的"卡开机"元凶**，
            > 且 AOSP GKI 刻意不默认启用它，因此这里默认关闭。缺它只影响 Docker 的
            > 设备白名单，可用 `--privileged` 或自定义 device cgroup 规则绕过。

            ### 🔧 若刷入后卡第一屏 —— 请按这个顺序排查

            1. **先回滚**：刷回你上个能开机的内核（`boot` 分区），确认设备可用再继续。
               ⚠️ 不要让设备一直停在反复重启状态，有触发 A/B 回滚或 data 损坏的风险。
            2. 重新构建，用**默认组合**：`container_mode=4` + `container_ipc_ns=true`，
               并确保 `cgroup_device_controller=false`、`risky_container_extras=false`。
               这一版完全不改 `task_struct`，是最有希望开机的组合。
            3. 若第 2 步**能**开机 → 说明就是 kABI 槽位问题。想要完整 SysV IPC 时，
               再切 `container_mode=2`（槽位 6+7;8）或 `3`（槽位 3+4;5）
               并打开 `risky_container_extras=true`，**每次只改这一个变量**。
            4. 若第 2 步**也**卡第一屏 → 说明问题不在 kABI，按下面两档继续二分：
               - 先试 `cgroup_device_controller=true` 之外的组合，即把它保持在 `false`
                 的同时把 `container_level` 降到 `minimal`（默认已是）；
               - 再构建 `container_mode=0`（完全不加容器配置）作为基线对照。
                 如果 `container_mode=0` 也卡第一屏 → 与容器改动无关，
                 问题在 ReSukiSU/SUSFS/zram/sched_ext 或内核本身。
            5. 若 `container_mode=0` 能开机，而安全模式 `4` 不能 → 逐项关闭安全模式里的
               基础项继续二分，优先怀疑 `CONFIG_USER_NS`、`OVERLAY_FS`、`NETFILTER_ADVANCED`。

            ### 🔎 抓取"到底卡在哪"的证据（比反复试错快得多）

            如果你能进 bootloader/recents 或 recovery，请尽量抓下面任一信息，
            这比继续盲试有用得多：

            - **内核是否 panic**：接 USB 后 `adb shell dmesg` 或 recovery 下
              `cat /proc/last_kmsg` / `dmesg`；看到 `Kernel panic` / `Unable to handle
              kernel NULL pointer` 就是内核崩溃，否则多半是 userspace/模块加载卡住。
            - **厂商模块是否加载失败**：
              `adb shell dmesg | grep -iE "module|vermagic|disagrees|unknown symbol"`
              —— 出现 `disagrees about version of symbol` 或 `unknown symbol`
              就说明是 kABI/符号 CRC 问题，应关掉 `risky_container_extras`。
            - **cgroup 控制器是否被 init 拒绝**：
              `adb shell dmesg | grep -iE "cgroup|devices.allow|init:"`

            设备端最终验证：`sudo ./check-config.sh`（moby）应无 `missing`，随后
            `pkg install root-repo && pkg install docker tini` 即可原生运行容器。
          # tag 不再承担"产物标识"职责：只用 p<run_number>.<run_attempt> 保证唯一，
          # 不带 KSUVER / 内核版本等语义（见上面 "Prepare release metadata" 步骤）。
          # prerelease=true + make_latest=false：这些内核仍在验证阶段，
          # 容器相关档位刷入有卡第一屏风险，绝不当作稳定版。
          prerelease: true
          make_latest: false
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: always()
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "## 🟢 ${{ env.DEVICE_NAME }} — ReSukiSU ${{ env.KSUVER }}"
            else
              echo "## 🔴 ${{ env.DEVICE_NAME }} — ReSukiSU ${{ env.KSUVER }}"
            fi
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 平台 | \`${{ env.CPU }}\` / \`${{ env.KANDROID_VERSION }}\` / \`${{ env.TKERNEL_VERSION }}\` |"
            echo "| 源码 | \`OnePlusOSS/kernel_manifest\` @ \`oneplus/sm8750\` |"
            echo "| ReSukiSU | \`${{ env.KSUVER }}\` (\`${{ env.KSU_COMMIT_SHA }}\`) |"
            echo "| SUSFS | \`${{ env.SUSVER }}\` / \`${{ env.SUSFS_BRANCH_NAME }}\` |"
            echo "| 容器支持 | ${{ env.CONTAINER_LABEL }} |"
            echo "| 容器档位 | \`mode=${{ env.CONTAINER_MODE }}\` / \`level=${{ env.CONTAINER_LEVEL }}\` / \`ipc_ns=${{ env.CONTAINER_IPC_NS }}\` / \`devices=${{ env.CGROUP_DEVICE_CONTROLLER }}\` / \`risky=${{ env.RISKY_CONTAINER_EXTRAS }}\` |"
            echo "| KPM | ❌ 已移除 |"
            echo "| ZIP | \`${{ env.ZIP_NAME }}\` |"
            echo "| Image SHA256 | \`${{ env.IMAGE_SHA256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
